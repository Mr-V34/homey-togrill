<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#E05000"/>
  <!-- Thermometer body -->
  <rect x="44" y="15" width="12" height="45" rx="6" fill="white" opacity="0.9"/>
  <!-- Thermometer bulb -->
  <circle cx="50" cy="68" r="10" fill="white" opacity="0.9"/>
  <!-- Mercury fill -->
  <rect x="46.5" y="42" width="7" height="20" fill="#E05000"/>
  <circle cx="50" cy="68" r="7" fill="#E05000"/>
  <!-- Tick marks -->
  <line x1="44" y1="25" x2="40" y2="25" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="44" y1="35" x2="40" y2="35" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="44" y1="45" x2="40" y2="45" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="44" y1="55" x2="40" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Flame hint -->
  <text x="50" y="95" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle" opacity="0.8">BBQ</text>
</svg>
