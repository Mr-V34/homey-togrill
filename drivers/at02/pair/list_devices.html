<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:;">
  <style>
    :root {
      --accent:        #E05000;
      --accent-light:  #fdeee6;
      --card-bg:       #f5f5f5;
      --card-border:   #e0e0e0;
      --text-primary:  #1a1a1a;
      --text-secondary:#666666;
      --radius:        12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      color: var(--text-primary);
      background: #ffffff;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .device-tile {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px 10px 12px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .device-tile:hover          { border-color: var(--accent); background: var(--accent-light); }
    .device-tile.selected       { border-color: var(--accent); background: var(--accent-light); }
    .device-tile.adding         { opacity: 0.5; pointer-events: none; }

    .tile-check {
      display: none;
      position: absolute;
      top: 8px; right: 8px;
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
    }
    .device-tile.selected .tile-check { display: flex; }
    .tile-check svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .tile-icon {
      width: 64px; height: 64px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      flex-shrink: 0;
    }
    .tile-icon img { width: 100%; height: 100%; object-fit: contain; }

    .tile-name {
      font-size: 13px; font-weight: 600;
      text-align: center; word-break: break-word;
      color: var(--text-primary);
    }
    .tile-sub {
      font-size: 10px;
      color: var(--text-secondary);
      text-align: center;
      word-break: break-all;
    }

    .spinner, .empty, .error-msg {
      grid-column: 1 / -1;
      padding: 28px 0;
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
    }
    .error-msg { color: #d9534f; padding: 10px 0; }

    .actions { margin-top: 20px; }

    .btn-connect {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #ffffff;
      font-size: 15px; font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-connect:disabled           { opacity: 0.35; cursor: not-allowed; }
    .btn-connect:not(:disabled):hover { opacity: 0.88; }
  </style>
</head>
<body>
  <h2>Select your ToGrill</h2>
  <div id="list"><p class="spinner">Scanning for ToGrill devices…</p></div>
  <div class="actions">
    <button class="btn-connect" id="btn-connect" disabled>Connect</button>
  </div>

  <script type="application/javascript">
    var listEl      = document.getElementById('list');
    var btnConnect  = document.getElementById('btn-connect');
    var selectedDev = null;

    function _safe(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    btnConnect.addEventListener('click', function () {
      if (!selectedDev) return;
      var tile = listEl.querySelector('.device-tile.selected');
      if (tile) { tile.classList.add('adding'); }
      btnConnect.disabled = true;

      Homey.createDevice(selectedDev)
        .then(function () { Homey.done(); })
        .catch(function (err) {
          if (tile) tile.classList.remove('adding');
          btnConnect.disabled = false;
          var prev = listEl.querySelector('.error-msg');
          if (prev) prev.remove();
          listEl.insertAdjacentHTML('beforeend',
            '<p class="error-msg">Error: ' + _safe(err && err.message ? err.message : String(err)) + '</p>');
        });
    });

    Homey.emit('list_devices', {})
      .then(function (devices) {
        listEl.innerHTML = '';
        if (!devices || devices.length === 0) {
          listEl.innerHTML = '<p class="empty">No ToGrill found.<br>Make sure it is powered on and nearby.</p>';
          return;
        }
        devices.forEach(function (device) {
          var uuid = (device.store && device.store.peripheralUuid) ? device.store.peripheralUuid : '';
          var tile = document.createElement('div');
          tile.className = 'device-tile';
          tile.innerHTML =
            '<div class="tile-check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div>' +
            '<div class="tile-icon"><img src="../assets/icon.svg" alt=""/></div>' +
            '<div class="tile-name">' + _safe(device.name) + '</div>' +
            '<div class="tile-sub">' + _safe(uuid.slice(0, 18)) + (uuid.length > 18 ? '…' : '') + '</div>';

          tile.addEventListener('click', function () {
            listEl.querySelectorAll('.device-tile.selected').forEach(function (t) { t.classList.remove('selected'); });
            tile.classList.add('selected');
            selectedDev = device;
            btnConnect.disabled = false;
          });
          listEl.appendChild(tile);
        });
      })
      .catch(function (err) {
        listEl.innerHTML = '<p class="error-msg">Scan failed: ' + _safe(err && err.message ? err.message : String(err)) + '</p>';
      });
  </script>
</body>
</html>
